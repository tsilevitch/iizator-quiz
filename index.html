<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f7fc"><title>Какой вы ИИзатор?</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#142c56;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:26px 16px}header{font-size:12px;letter-spacing:.1em;color:#4779aa;font-weight:700}h1{font-size:clamp(32px,7vw,48px);line-height:1.12}section{background:white;padding:clamp(20px,5vw,35px);border-radius:22px;box-shadow:0 8px 35px #12336612;margin:25px 0}h2{font-size:24px;line-height:1.3}.muted{color:#60728b}.progress{height:7px;border-radius:9px;background:#e7eef8;margin:18px 0 25px}.bar{height:100%;background:#1683ee;border-radius:9px;transition:width .2s}.opt{display:block;width:100%;text-align:left;padding:17px;margin:11px 0;border:1px solid #d8e5f5;background:#f7faff;color:#152f59;border-radius:13px;font:inherit;min-height:64px;touch-action:manipulation;cursor:pointer}.opt:active{background:#dcefff}.action{padding:13px 18px;background:#137bea;color:white;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}.secondary{background:#e8eff9;color:#183c6b}.action:disabled{opacity:.35}.hidden{display:none}.result{background:linear-gradient(125deg,#e6f3ff,#f1edff);border-radius:14px;padding:20px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}footer{font-size:11px;color:#6b89a8;text-align:center;padding:20px 0}</style></head><body><main><header>БОЛЬШЕ ФАКТОВ · МЕНЬШЕ РИСКОВ</header><h1>Какой вы ИИзатор?</h1><p class="muted">7 ситуаций, 4 типажа и немного самоиронии. Это развлекательный тест о привычках работы с ИИ.</p><section><div id="quiz"><small id="count"></small><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="options"></div><button id="back" class="action secondary">Назад</button></div><div id="final" class="hidden"><small>Ваш результат</small><div class="result"><h2 id="type"></h2><p id="motto"></p></div><p id="desc"></p><div class="nav"><button class="action secondary" id="restart">Пройти еще раз</button><button class="action" id="share">Поделиться</button></div><p id="status" class="muted"></p></div></section><footer>ЗАКУПКИ · ПОСТАВЩИКИ · КОМАНДЫ · РЕЗУЛЬТАТЫ | Анна Цилевич | procuresense.ru</footer></main><script>const qs=[["Нужно срочно найти информацию о новом поставщике. Что делаете?",[["Проверю официальные реестры и документы","analog"],["Попрошу ИИ собрать досье","evangelist"],["Попробую несколько промптов для полного обзора","shaman"],["ИИ поможет составить план поиска, факты сверю с источниками","reasonable"]]],["Нужна формула Excel. Ваш ход?",[["Сначала определю расчет, затем проверю формулу","reasonable"],["Напишу сама, даже если придется вспоминать синтаксис","analog"],["Загружу задачу в ИИ","evangelist"],["Буду уточнять запрос, пока модель не даст формулу","shaman"]]],["Предлагают внедрить ИИ в согласование договоров.",[["Попрошу модель придумать идеальный промпт","shaman"],["Сначала разберусь, где возникают задержки","reasonable"],["Начну выбирать ИИ-платформу","evangelist"],["Оставлю ручную проверку юристам","analog"]]],["ИИ подготовил красивый анализ предложений.",[["Отправлю руководителю, выглядит готовым","evangelist"],["Проверю данные, расчеты и выводы","reasonable"],["Пересчитаю все вручную","analog"],["Попрошу сделать текст еще убедительнее","shaman"]]],["Коллега автоматизировал 15 отчетов. Ваша реакция?",[["Спрошу, какой инструмент он использовал","evangelist"],["Попрошу ИИ написать промпты для таких отчетов","shaman"],["Узнаю, кому нужны отчеты и что изменилось","reasonable"],["Останусь со своими таблицами","analog"]]],["ИИ-агент может самостоятельно размещать заказы.",[["Разрешу только в пределах лимитов и правил контроля","reasonable"],["Нет, заказы должен размещать человек","analog"],["Отлично, запускаем!","evangelist"],["Начну с разработки идеального промпта","shaman"]]],["ИИ не справился с задачей. Что дальше?",[["Попробую другую модель","evangelist"],["Вернусь к привычному способу","analog"],["Пересмотрю данные и саму постановку задачи","reasonable"],["Буду переформулировать запрос","shaman"]]]],types={"evangelist":["ИИ-евангелист","У меня на это уже есть нейросеть!","Ты быстро пробуешь инструменты, но иногда технология появляется раньше, чем понятна задача."],"shaman":["Промптовый шаман","Еще один промпт, и точно получится!","Иногда задача требует не нового промпта, а других данных или инструмента."],"analog":["Аналоговый сопротивленец","Руками надежнее!","Ты ценишь проверенные методы, но иногда переплачиваешь за них временем."],"reasonable":["Разумный ИИзатор","Сначала задача, потом инструмент","Ты выбираешь инструмент с учетом цели, качества и ограничений. Главное, не застрять в анализе."]};let step=0,ans={};const $=id=>document.getElementById(id);const order=qs.map((q,i)=>{let a=q[1].slice();let s=(i+1)*987643;for(let k=a.length-1;k>0;k--){s=(Math.imul(s,1664525)+1013904223)>>>0;let j=s%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a});function draw(){$('quiz').classList.remove('hidden');$('final').classList.add('hidden');$('count').textContent='Вопрос '+(step+1)+' из '+qs.length;$('bar').style.width=(100*step/qs.length)+'%';$('question').textContent=qs[step][0];$('options').replaceChildren();order[step].forEach(([label,type])=>{let b=document.createElement('button');b.type='button';b.className='opt';b.textContent=label;b.onclick=()=>{ans[step]=type;if(step===qs.length-1)finish();else{step++;draw();window.scrollTo(0,0)}};$('options').appendChild(b)});$('back').disabled=step===0}function finish(){let s={reasonable:0,shaman:0,evangelist:0,analog:0};Object.values(ans).forEach(t=>s[t]++);let key=['reasonable','shaman','evangelist','analog'].reduce((a,b)=>s[b]>s[a]?b:a);let t=types[key];$('quiz').classList.add('hidden');$('final').classList.remove('hidden');$('type').textContent=t[0];$('motto').textContent='«'+t[1]+'»';$('desc').textContent=t[2];$('status').textContent='';window.result=t;window.scrollTo(0,0)}$('back').onclick=()=>{if(step){step--;draw()}};$('restart').onclick=()=>{step=0;ans={};draw()};$('share').onclick=async()=>{let t=window.result,msg='Мой результат: '+t[0]+'. '+t[1];try{if(navigator.share){await navigator.share({title:'Какой вы ИИзатор?',text:msg,url:location.href});return}await navigator.clipboard.writeText(msg+' '+location.href);$('status').textContent='Результат скопирован'}catch(e){$('status').textContent=msg+' '+location.href}};draw();</script></body></html>
